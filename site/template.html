<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="robots" content="{{ROBOTS}}">
<meta name="author" content="{{NAME}}">
<meta name="theme-color" content="#0F1113">
<meta name="color-scheme" content="light">
<link rel="canonical" href="{{SITE_URL}}/">
<meta property="og:type" content="profile">
<meta property="og:site_name" content="{{NAME}}">
<meta property="og:url" content="{{SITE_URL}}/">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:image" content="{{SITE_URL}}/{{OG_IMAGE}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{NAME}}. {{POSITIONING}}">
<meta property="og:locale" content="en_ZA">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<meta name="twitter:image" content="{{SITE_URL}}/{{OG_IMAGE}}">
<link rel="stylesheet" href="theme.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230F1113'/%3E%3Ctext x='21' y='44' font-family='Georgia,serif' font-size='29' fill='%23F6F2E9' text-anchor='middle'%3ER%3C/text%3E%3Ctext x='45' y='44' font-family='Georgia,serif' font-size='29' font-style='italic' fill='%23FF7A45' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<link rel="alternate" type="text/plain" href="{{SITE_URL}}/llms.txt" title="Plain-text summary for AI agents">
<script type="application/ld+json">{{JSON_LD}}</script>
</head>
<body>
<header class="cover">
<p class="cover-meta"><span>{{ROLE}}</span><span>{{CITY}}, {{COUNTRY}}</span></p>
<div class="cover-body">
<div class="cover-portrait">
<!--PORTRAIT-->
</div>
<div class="cover-text">
<h1 class="name">{{NAME}}</h1>
<p class="positioning">{{POSITIONING}}</p>
<p class="summary">{{SUMMARY}}</p>
</div>
</div>
</header>
<main>
<section class="work" aria-labelledby="work-title">
<h2 class="band-label" id="work-title">What I run</h2>
<!--COMPANIES-->
</section>
<div class="elsewhere">
<!--CONTACT-->
</div>
</main>
<footer class="colophon">
<p class="tagline">{{TAGLINE}}</p>
<p class="copy">&copy; {{YEAR}} {{NAME}}</p>
</footer>
</body>
</html>
